<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dining Philosophers Monitor</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    padding: 30px;
}

main {
    max-width: 1100px;
    margin: auto;
}

h1 {
    text-align: center;
}

.table {
    background: white;
    padding: 25px;
    border-radius: 20px;
}

.philosophers,
.forks {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.philosopher {
    background: #ecfdf5;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
}

.fork {
    background: white;
    border: 2px solid #ddd;
    padding: 15px;
    text-align: center;
    border-radius: 10px;
}

.controls {
    text-align: center;
    margin: 25px;
}

button {
    padding: 10px 16px;
    margin: 4px;
    cursor: pointer;
}

.log {
    background: #111827;
    color: white;
    padding: 20px;
    border-radius: 10px;
}
</style>
</head>

<body>

<main>

<h1>Dining Philosophers - Monitor Simulation</h1>

<div class="table">
<h2>Philosophers</h2>
<div id="philosophers" class="philosophers"></div>

<h2>Fork Ownership</h2>
<div id="forks" class="forks"></div>
</div>

<div class="controls">
<button onclick="previous()">Previous</button>
<button onclick="play()">Play</button>
<button onclick="pause()">Pause</button>
<button onclick="next()">Next</button>
<button onclick="resetSimulation()">Reset</button>
</div>

<div class="log">
<p>Event: <strong id="event"></strong></p>
<p>Time: <strong id="time"></strong> seconds</p>
<p id="message"></p>
</div>

</main>

let index = 0;
let timer = null;

function render() {
    const e = events[index];

    document.getElementById("event").textContent = e.number + " / " + events.length;
    document.getElementById("time").textContent = e.time.toFixed(3);
    document.getElementById("message").textContent = e.message;

    const philosopherArea = document.getElementById("philosophers");
    philosopherArea.innerHTML = "";

    e.states.forEach((state, i) => {
        philosopherArea.innerHTML += `
            <div class="philosopher">
                <h2>P${i}</h2>
                <strong>${state}</strong>
                <p>Meals completed: ${e.meals[i]}</p>
            </div>
        `;
    });

    const forkArea = document.getElementById("forks");
    forkArea.innerHTML = "";

    e.forkOwners.forEach((owner, i) => {
        const status = owner === -1 ? "Available" : "Owned by P" + owner;

        forkArea.innerHTML += `
            <div class="fork">
                <strong>F${i}</strong>
                <br><br>
                ${status}
            </div>
        `;
    });
}

function next() {
    if (index < events.length - 1) {
        index++;
        render();
    }
}

function previous() {
    if (index > 0) {
        index--;
        render();
    }
}

function play() {
    if (timer !== null) {
        return;
    }

    timer = setInterval(() => {
        if (index < events.length - 1) {
            index++;
            render();
        } else {
            pause();
        }
    }, 800);
}

function pause() {
    clearInterval(timer);
    timer = null;
}

function resetSimulation() {
    pause();
    index = 0;
    render();
}

render();

</script>
